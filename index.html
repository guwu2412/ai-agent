<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 模拟面试官</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #343541; color: white; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        .header { text-align: center; padding: 20px; border-bottom: 1px solid #444; font-size: 20px; font-weight: bold; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .message { max-width: 800px; width: 100%; padding: 20px; box-sizing: border-box; display: flex; gap: 15px; }
        .user { background-color: #343541; border-bottom: 1px solid #444; }
        .assistant { background-color: #444654; }
        .avatar { width: 30px; height: 30px; border-radius: 5px; text-align: center; line-height: 30px; font-size: 20px; }
        .user .avatar { background-color: #10a37f; }
        .assistant .avatar { background-color: #19c37d; }
        .content { flex: 1; line-height: 1.6; white-space: pre-wrap; }
        .input-container { padding: 20px; text-align: center; }
        input { width: 60%; padding: 15px; border-radius: 8px; border: 1px solid #555; background-color: #40414f; color: white; outline: none; font-size: 16px; }
        button { padding: 15px 25px; border-radius: 8px; background-color: #19c37d; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="header">🤖 AI 技术面试官</div>
    <div class="chat-container" id="chat"></div>
    <div class="input-container">
        <input type="text" id="msg" placeholder="请输入你的回答..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">发送</button>
    </div>

    <script>
        const threadId = "web_" + Math.random().toString(36).substring(2, 9);

        function appendMessage(role, text) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
                <div class="content">${text}</div>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function send() {
            const input = document.getElementById('msg');
            const text = input.value.trim();
            if(!text) return;

            appendMessage('user', text);
            input.value = '';

            try {
                const res = await fetch('http://127.0.0.1:8000/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ thread_id: threadId, message: text })
                });
                const data = await res.json();
                appendMessage('assistant', data.reply);
            } catch (e) {
                appendMessage('assistant', '请求失败，请确保 api.py 正在运行。');
            }
        }
    </script>
</body>
</html>
